[project]
name = "video-frame-extractor"
version = "2.1.0"
description = "Local web app that downloads a video, extracts frames and cuts vertical shorts"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"

# Manage dependencies with uv:  uv add <package>  /  uv remove <package>  /  uv lock --upgrade-package <package>
dependencies = [
    # Web app
    "flask==2.3.3",
    "werkzeug==3.1.9",
    "flask-limiter==3.12",
    "limits>=3.13",
    # Ranges, not exact pins, for libraries that other tools commonly share an environment
    # with: the app only uses their stable APIs, and the test suite passes on both ends of
    # each range (requests 2.32.4+ fixes a netrc credential leak; psutil 6.1 through 7.2).
    "python-dotenv>=1.0.0,<2",
    "requests>=2.32.4,<3",
    "psutil>=6.1,<8",

    # Video download. Platform extractors change often: upgrade yt-dlp first when downloads
    # break (uv lock --upgrade-package yt-dlp).
    # The curl-cffi extra lets yt-dlp present itself as a real browser. TikTok sends plain
    # Python clients a bot-check page ("Unexpected response from webpage request"), so without
    # it no TikTok link can be read, even on the newest yt-dlp.
    # The default extra brings yt-dlp-ejs, the scripts that solve YouTube's download challenges
    # (run by Deno or Node.js, see video_processor.JS_RUNTIMES). Without them YouTube cuts
    # downloads off part-way with "HTTP Error 403: Forbidden".
    "yt-dlp[default,curl-cffi]==2026.8.19",

    # Frame extraction and short-video rendering. MoviePy bundles its own FFmpeg through
    # imageio-ffmpeg, which the app also uses directly to merge downloaded streams.
    "opencv-python==4.8.1.78",
    # opencv-python 4.8 is built against NumPy 1.x and fails to import under NumPy 2
    "numpy==1.26.4",
    "moviepy==1.0.3",
    # MoviePy's progress logger; subclassed to report render progress and cancel jobs
    "proglog==0.1.12",
    "imageio-ffmpeg>=0.4",
    "pillow==12.3.0",

    # YouTube upload (optional feature)
    "google-api-python-client==2.100.0",
    "google-auth-oauthlib==1.2.2",
    "google-auth-httplib2==0.2.0",
    "google-auth>=2.38,<3",
    # Pinned so each upgrade arrives as its own reviewable pull request. oauthlib 4.0.0 (which
    # fixes PYSEC-2026-4114) builds the Google consent URL correctly; if a YouTube sign-in fails
    # at the token exchange, go back to oauthlib 3.2.2 first.
    "requests-oauthlib==2.0.0",
    "oauthlib==4.0.0",

    # Vietnamese subtitles (subtitles.py), all offline: faster-whisper turns the speech into
    # text, the Argos Translate models (run directly by CTranslate2 and SentencePiece, without
    # the argostranslate package and its PyTorch dependency) translate it.
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.2",
    "sentencepiece==0.2.2",

    # Production server (Linux/macOS only; use `uv run python app_enhanced.py` on Windows)
    "gunicorn==26.2.0; sys_platform != 'win32'",
]

[dependency-groups]
# Installed by `uv sync` by default; leave out with --no-dev (production)
dev = [
    "httplib2",   # imported by the YouTube upload tests (also a dependency of google-api-python-client)
    "pip-audit",
]

[tool.uv]
# An application, not a library: the modules live in the project root and are not built or installed
package = false
# onnxruntime (faster-whisper's voice detection) dropped Python 3.10 wheels after 1.23.2, but
# its metadata does not say so: without this the lock picks a release 3.10 cannot install
constraint-dependencies = ["onnxruntime<1.24; python_version < '3.11'"]
