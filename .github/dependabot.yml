version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # yt-dlp extractors break often, so it gets its own pull request
      yt-dlp:
        patterns: ["yt-dlp"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
